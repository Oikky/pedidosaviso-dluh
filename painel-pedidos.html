<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ Painel de Pedidos</title>
<meta name="theme-color" content="#f97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0c0a; --surface: #1a1714; --surface2: #231f1b; --border: #2e2925;
  --accent: #f97316; --accent2: #fbbf24; --accent-soft: rgba(249,115,22,0.12);
  --green: #22c55e; --green-soft: rgba(34,197,94,0.12);
  --blue: #60a5fa; --blue-soft: rgba(96,165,250,0.12);
  --red: #f87171; --red-soft: rgba(248,113,113,0.12);
  --text: #f5f0ea; --text2: #a89880; --text3: #6b5f52;
  --r: 14px; --rs: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

/* APP LAYOUT */
#app { display: flex; flex-direction: column; min-height: 100vh; }

/* HEADER */
.hdr {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
}
.hdr-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--accent); flex: 1; }
.hdr-clock { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; letter-spacing: .05em; }
.hdr-date { font-size: .72rem; color: var(--text2); }
.btn-ic {
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--rs);
  color: var(--text2); cursor: pointer; padding: 7px 10px; font-size: .9rem;
  display: flex; align-items: center; gap: 5px; transition: all .2s;
}
.btn-ic:hover { color: var(--text); border-color: var(--text2); }
.sdot { width:6px; height:6px; border-radius:50%; background:var(--green); animation: pdot 2s ease-in-out infinite; }
.sdot.off { background:var(--text3); animation:none; }
@keyframes pdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }

/* UNLOCK AUDIO BTN */
#unlock-btn {
  position: fixed; bottom: 20px; right: 20px; z-index: 500;
  background: var(--accent); color: #fff; font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: .9rem; padding: 14px 20px; border-radius: 12px;
  cursor: pointer; box-shadow: 0 4px 20px rgba(249,115,22,.5);
  animation: pg 2s ease-in-out infinite; border: none;
}
@keyframes pg { 0%,100%{box-shadow:0 0 20px rgba(249,115,22,.3)} 50%{box-shadow:0 0 40px rgba(249,115,22,.6)} }

/* MAIN */
.main { display: flex; flex: 1; }
.col-featured { width: 100%; padding: 14px; }
.col-queue { flex: 1; padding: 14px; border-top: 1px solid var(--border); }
@media(min-width:900px) {
  .col-featured { width: 400px; flex-shrink: 0; border-right: 1px solid var(--border); border-top: none; }
  .col-queue { border-top: none; }
  .main { flex-direction: row; }
}

/* SECTION LABEL */
.slabel {
  font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text3); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.slabel::after { content:''; flex:1; height:1px; background:var(--border); }

/* FEATURED CARD */
.fc {
  background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--r);
  overflow: hidden; box-shadow: 0 0 40px rgba(249,115,22,.15);
  animation: fcglow 3s ease-in-out infinite;
}
@keyframes fcglow { 0%,100%{box-shadow:0 0 30px rgba(249,115,22,.12)} 50%{box-shadow:0 0 50px rgba(249,115,22,.28)} }
.fc-hdr {
  background: linear-gradient(135deg, var(--accent), #ea580c);
  padding: 13px 15px; display: flex; align-items: center; gap: 8px;
}
.fc-badge {
  background: rgba(255,255,255,.2); border-radius:5px; padding:2px 8px;
  font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#fff;
}
.fc-name { flex:1; font-family:'Syne',sans-serif; font-weight:700; font-size:.95rem; color:#fff; }
.fc-tipo { font-size:.8rem; font-weight:600; color:rgba(255,255,255,.9); }
.fc-body { padding: 13px 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fc-box { background:var(--surface2); border-radius:var(--rs); padding:9px 11px; }
.fc-box-label { font-size:.65rem; color:var(--text3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px; }
.fc-box-val { font-family:'Syne',sans-serif; font-weight:700; font-size:.9rem; }
.fc-box-val.hl { color:var(--accent); font-size:1.05rem; }
.fc-timer {
  background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--rs);
  padding:9px 11px; grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
}
.fc-timer-lbl { font-size:.72rem; color:var(--accent); font-weight:500; }
.fc-timer-val { font-family:'Syne',sans-serif; font-weight:800; font-size:1.35rem; color:var(--accent); letter-spacing:.05em; }
.fc-timer-val.urg { color:var(--red); animation:blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.fc-late { background:var(--red-soft); border:1px solid var(--red); border-radius:var(--rs); padding:9px 13px; margin:0 15px 10px; display:flex; align-items:center; gap:8px; animation:lpulse 1.5s ease-in-out infinite; }
@keyframes lpulse { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 16px rgba(248,113,113,.4)} }
.fc-late-txt { flex:1; font-size:.82rem; color:var(--red); font-weight:600; }
.fc-late-min { font-family:'Syne',sans-serif; font-weight:800; color:var(--red); }
.items-toggle { display:flex; align-items:center; gap:6px; color:var(--text2); font-size:.78rem; cursor:pointer; user-select:none; padding:0 15px; margin-bottom:8px; }
.items-toggle svg { transition:transform .2s; }
.items-toggle.open svg { transform:rotate(180deg); }
.items-list { display:none; padding:0 15px 4px; }
.items-list.open { display:block; }
.icat { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--accent2); margin:8px 0 3px; }
.irow { display:flex; align-items:baseline; gap:5px; padding:2px 0; border-bottom:1px solid rgba(255,255,255,.04); }
.iqty { font-family:'Syne',sans-serif; font-weight:700; font-size:.88rem; color:var(--accent); min-width:26px; }
.iname { font-size:.82rem; color:var(--text2); flex:1; }
.fc-foot { padding:11px 15px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.fc-phone { font-size:.8rem; color:var(--text2); }
.fc-total { font-family:'Syne',sans-serif; font-weight:800; font-size:1.05rem; color:var(--green); }
.btn-deliver {
  width:100%; margin:0 15px 14px; width:calc(100% - 30px);
  background:var(--green-soft); border:1px solid var(--green); border-radius:var(--rs);
  color:var(--green); font-family:'Syne',sans-serif; font-weight:700; font-size:.82rem;
  padding:9px 14px; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-deliver:hover { background:var(--green); color:#fff; }
.btn-deliver.late { background:var(--red-soft); border-color:var(--red); color:var(--red); }
.btn-deliver.late:hover { background:var(--red); color:#fff; }
.btn-deliver:disabled { opacity:.5; cursor:default; }
.no-fc { background:var(--surface); border:1px dashed var(--border); border-radius:var(--r); padding:30px; text-align:center; color:var(--text3); font-size:.88rem; }

/* QUEUE */
.filter-bar { display:flex; gap:7px; margin-bottom:12px; overflow-x:auto; scrollbar-width:none; }
.filter-bar::-webkit-scrollbar { display:none; }
.fbtn { flex-shrink:0; background:var(--surface2); border:1px solid var(--border); border-radius:20px; color:var(--text2); font-size:.75rem; font-weight:500; padding:5px 13px; cursor:pointer; transition:all .2s; }
.fbtn.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.qcard {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:13px; cursor:pointer; transition:all .2s; position:relative; overflow:hidden; margin-bottom:9px;
}
.qcard::before { content:''; position:absolute; left:0;top:0;bottom:0; width:3px; background:var(--border); }
.qcard.retirada::before { background:var(--green); }
.qcard.entrega::before { background:var(--blue); }
.qcard-top { display:flex; align-items:center; gap:7px; margin-bottom:3px; }
.qpos { font-family:'Syne',sans-serif; font-size:.72rem; font-weight:800; color:var(--text3); min-width:20px; }
.qname { flex:1; font-weight:500; font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qtime { font-family:'Syne',sans-serif; font-weight:700; font-size:.82rem; color:var(--text2); }
.qcard-bot { display:flex; align-items:center; gap:7px; padding-left:27px; }
.tag { display:inline-flex; align-items:center; gap:3px; border-radius:20px; padding:2px 7px; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.tag.retirada { background:var(--green-soft); color:var(--green); }
.tag.entrega { background:var(--blue-soft); color:var(--blue); }
.tag.urgente { background:var(--red-soft); color:var(--red); }
.qdate { font-size:.72rem; color:var(--text3); }
.qcd { margin-left:auto; font-size:.72rem; color:var(--text3); font-family:'Syne',sans-serif; }
.qcd.soon { color:var(--accent); font-weight:700; }
.qcd.urg { color:var(--red); font-weight:700; }
.qdetails { display:none; padding-top:10px; margin-top:9px; border-top:1px solid var(--border); padding-left:27px; }
.qdetails.open { display:block; }
.btn-qdeliver {
  background:var(--green-soft); border:1px solid var(--green); border-radius:var(--rs);
  color:var(--green); font-family:'Syne',sans-serif; font-weight:700; font-size:.78rem;
  padding:7px 12px; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:5px; margin-top:9px;
}
.btn-qdeliver:hover { background:var(--green); color:#fff; }
.btn-qdeliver.late { background:var(--red-soft); border-color:var(--red); color:var(--red); }
.btn-qdeliver.late:hover { background:var(--red); color:#fff; }

/* TOAST */
.toast-wrap { position:fixed; top:0; left:0; right:0; z-index:999; pointer-events:none; }
.toast {
  background:linear-gradient(135deg,#f97316,#ea580c); color:#fff;
  padding:14px 18px; display:flex; align-items:center; gap:9px;
  transform:translateY(-100%); transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  pointer-events:all; box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.toast.show { transform:translateY(0); }
.toast-body { flex:1; }
.toast-title { font-family:'Syne',sans-serif; font-weight:700; font-size:.95rem; }
.toast-sub { font-size:.78rem; opacity:.9; }
.toast-close { background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; padding:0 3px; }

.rlabel { text-align:center; padding:7px; font-size:.7rem; color:var(--text3); }
.empty { text-align:center; padding:40px 20px; color:var(--text3); }
.empty-icon { font-size:2.2rem; margin-bottom:10px; }
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-logo">🍽️ Pedidos</div>
    <div style="flex:1"></div>
    <div style="text-align:right">
      <div class="hdr-clock" id="clock">--:--</div>
      <div class="hdr-date" id="date-txt"></div>
    </div>
    <button class="btn-ic" id="sound-btn" onclick="toggleSound()">
      <div class="sdot" id="sdot"></div>
      <span id="slabel">Som</span>
    </button>
    <button class="btn-ic" onclick="fetchOrders()" title="Atualizar">⟳</button>
  </header>

  <button id="unlock-btn" onclick="unlockAudio()">🔊 Toque para ativar o som</button>

  <div class="main">
    <!-- FEATURED -->
    <div class="col-featured">
      <div class="slabel">▶ Próximo</div>
      <div id="featured"></div>
    </div>

    <!-- QUEUE -->
    <div class="col-queue">
      <div class="slabel">Fila do dia</div>
      <div class="filter-bar">
        <button class="fbtn active" onclick="setFilter('todos',this)">Todos</button>
        <button class="fbtn" onclick="setFilter('retirada',this)">🛍️ Retirada</button>
        <button class="fbtn" onclick="setFilter('entrega',this)">🛵 Entrega</button>
        <button class="fbtn" onclick="setFilter('urgente',this)">🔥 Urgente</button>
      </div>
      <div id="queue"></div>
      <div class="rlabel" id="rlabel">—</div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap">
  <div class="toast" id="toast">
    <div style="font-size:1.3rem">🔔</div>
    <div class="toast-body">
      <div class="toast-title" id="toast-title"></div>
      <div class="toast-sub" id="toast-sub"></div>
    </div>
    <button class="toast-close" onclick="hideToast()">×</button>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const CFG = {
  token: 'c2df9327-a40c-4716-9f59-c40620d691ef',
  docId: 'Wq8ktEEI3N',
  tableId: 'Pedidos Base',
  cols: {
    nome: 'Cliente',
    data: 'Data e Hora',
    tipo: 'Entrega/Retirada',
    pedido: 'Nota',
    telefone: 'Número',
    valor: 'Valor Total',
    status: 'Status',
    statusValor: 'Entregue'
  },
  alertHours: 1
};

// ── STATE ───────────────────────────────────────────────
let orders = [];
let filter = 'todos';
let soundOn = true;
let alerted = new Set();
let audioCtx = null;
let audioUnlocked = false;

// ── CLOCK ───────────────────────────────────────────────
function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('date-txt').textContent =
    now.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
}
setInterval(tickClock, 1000);
tickClock();

// ── AUDIO ───────────────────────────────────────────────
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function unlockAudio() {
  getCtx();
  audioUnlocked = true;
  document.getElementById('unlock-btn').style.display = 'none';
  playBell(1).then(() => speak('Som ativado!'));
}

async function playBell(intensity) {
  const ctx = getCtx();
  const ring = (delay, freq, gain) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    o2.type = 'sine'; o2.frequency.value = freq * 2.76;
    g.gain.setValueAtTime(0, ctx.currentTime + delay);
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + delay + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 2.5);
    g2.gain.setValueAtTime(0, ctx.currentTime + delay);
    g2.gain.linearRampToValueAtTime(gain * 0.3, ctx.currentTime + delay + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 1.5);
    o.connect(g); g.connect(ctx.destination);
    o2.connect(g2); g2.connect(ctx.destination);
    o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 2.5);
    o2.start(ctx.currentTime + delay); o2.stop(ctx.currentTime + delay + 1.5);
  };
  const rings = intensity >= 3 ? 4 : intensity === 2 ? 3 : 2;
  const freq = intensity >= 3 ? 880 : intensity === 2 ? 740 : 660;
  for (let i = 0; i < rings; i++) ring(i * 0.55, freq, 0.6);
  return new Promise(r => setTimeout(r, rings * 550 + 500));
}

function speak(text) {
  if (!soundOn) return;
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR'; u.rate = 0.88; u.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const pt = voices.find(v => v.lang === 'pt-BR') || voices.find(v => v.lang.startsWith('pt'));
    if (pt) u.voice = pt;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('sdot').className = 'sdot' + (soundOn ? '' : ' off');
  document.getElementById('slabel').textContent = soundOn ? 'Som' : 'Mudo';
  if (soundOn) playBell(1).then(() => speak('Som ativado!'));
}

// ── TOAST ───────────────────────────────────────────────
let toastTimer = null;
function showToast(title, sub) {
  document.getElementById('toast-title').textContent = title;
  document.getElementById('toast-sub').textContent = sub || '';
  document.getElementById('toast').classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

// ── ALERTS ──────────────────────────────────────────────
const STAGES = [60, 30, 15, 5, 0];

async function triggerAlert(order, mins, type) {
  const isEntrega = order.tipo.toLowerCase().includes('entrega');
  const tipo = isEntrega ? 'entrega' : 'retirada';
  let bell, title, speech;

  if (type === 'late') {
    bell = 3; title = `⚠️ ATRASADO ${mins}min — ${order.nome}`;
    speech = `Atenção! O pedido de ${order.nome} está atrasado ${mins} minutos.`;
  } else if (mins === 0) {
    bell = 3; title = `🔔 AGORA — ${order.nome}`;
    speech = `Hora do pedido! ${order.nome}, ${tipo} agora!`;
  } else if (mins <= 5) {
    bell = 3; title = `🔥 ${mins} min — ${order.nome}`;
    speech = `Urgente! ${mins} minutos para o pedido de ${order.nome}.`;
  } else if (mins <= 15) {
    bell = 2; title = `⏰ ${mins} min — ${order.nome}`;
    speech = `Atenção! ${mins} minutos para o pedido de ${order.nome} para ${tipo}.`;
  } else {
    bell = 1; title = `🔔 ${mins} min — ${order.nome}`;
    speech = `Lembrete. ${mins} minutos para o pedido de ${order.nome} para ${tipo}.`;
  }

  showToast(title, fmtTime(order.datetime) + ' · ' + (isEntrega ? '🛵 Entrega' : '🛍️ Retirada'));
  if (soundOn) { await playBell(bell); speak(speech); }
  renderAll();
}

function checkAlerts() {
  const now = new Date();
  orders.forEach(o => {
    if (o.entregue) return;
    const diffMin = Math.round((o.datetime - now) / 60000);
    STAGES.forEach(s => {
      const key = `${o.id}_s${s}`;
      if (diffMin <= s && diffMin > s - 1.5 && !alerted.has(key)) {
        alerted.add(key); triggerAlert(o, s, 'pre');
      }
    });
    if (diffMin < 0) {
      const lk = `${o.id}_late${Math.floor(Math.abs(diffMin) / 5)}`;
      if (!alerted.has(lk)) { alerted.add(lk); triggerAlert(o, Math.abs(diffMin), 'late'); }
    }
  });
}
setInterval(checkAlerts, 30000);

// ── CODA ────────────────────────────────────────────────
async function fetchOrders() {
  document.getElementById('rlabel').textContent = '⟳ Atualizando...';
  try {
    const url = `https://coda.io/apis/v1/docs/${CFG.docId}/tables/${encodeURIComponent(CFG.tableId)}/rows?useColumnNames=true&limit=200`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${CFG.token}` } });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      document.getElementById('rlabel').textContent = `❌ ${e.message || res.status}`;
      return;
    }
    const data = await res.json();
    orders = parseRows(data.items || []);
    renderAll(); checkAlerts();
    document.getElementById('rlabel').textContent =
      '✓ Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  } catch(e) {
    document.getElementById('rlabel').textContent = '❌ Sem conexão';
  }
}

function parseRows(rows) {
  const c = CFG.cols;
  const today = new Date(); today.setHours(0,0,0,0);
  return rows.map((row, i) => {
    const v = row.values || {};
    let dt = null;
    const raw = v[c.data];
    if (raw) {
      if (typeof raw === 'number') { dt = new Date(raw); }
      else {
        dt = new Date(raw);
        if (isNaN(dt)) {
          const m = String(raw).match(/(\d{2})\/(\d{2})\/(\d{4})[,\s]+(\d{2}):(\d{2})/);
          if (m) dt = new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
        }
      }
    }
    if (!dt || isNaN(dt)) return null;
    const d = new Date(dt); d.setHours(0,0,0,0);
    if (d.getTime() !== today.getTime()) return null;
    return {
      id: row.id || String(i),
      nome: v[c.nome] || '(sem nome)',
      telefone: v[c.telefone] || '',
      tipo: v[c.tipo] || 'Retirada',
      datetime: dt,
      pedido: v[c.pedido] || '',
      valor: v[c.valor] || '',
      entregue: String(v[c.status] || '').toLowerCase() === String(c.statusValor).toLowerCase()
    };
  }).filter(Boolean).sort((a,b) => a.datetime - b.datetime);
}

async function markDelivered(id) {
  const btn = document.getElementById('db-' + id);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Salvando...'; }
  const o = orders.find(x => x.id === id);
  if (o) o.entregue = true;
  try {
    const url = `https://coda.io/apis/v1/docs/${CFG.docId}/tables/${encodeURIComponent(CFG.tableId)}/rows/${id}`;
    const res = await fetch(url, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${CFG.token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ row: { cells: [{ column: CFG.cols.status, value: CFG.cols.statusValor }] } })
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      showToast('❌ Erro ao salvar', e.message || '');
      if (o) o.entregue = false;
      if (btn) { btn.disabled = false; btn.textContent = '✓ Marcar como Entregue'; }
      return;
    }
    showToast('✅ Concluído!', o ? o.nome : '');
    speak('Pedido marcado como entregue!');
  } catch(e) {
    showToast('❌ Erro de conexão', e.message);
    if (o) o.entregue = false;
    if (btn) { btn.disabled = false; btn.textContent = '✓ Marcar como Entregue'; }
    return;
  }
  renderAll();
}

// ── RENDER ──────────────────────────────────────────────
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function renderAll() {
  const now = new Date();
  const upcoming = orders.filter(o => !o.entregue && o.datetime >= now);
  const lateUndel = orders.filter(o => !o.entregue && o.datetime < now).sort((a,b) => b.datetime - a.datetime);
  const featured = upcoming[0] || lateUndel[0] || null;
  renderFeatured(featured, now);
  const filtered = orders.filter(o => {
    if (filter === 'retirada') return o.tipo.toLowerCase().includes('retirada');
    if (filter === 'entrega') return o.tipo.toLowerCase().includes('entrega');
    if (filter === 'urgente') { const m = (o.datetime - now) / 60000; return m >= 0 && m <= 60; }
    return true;
  });
  renderQueue(filtered.filter(o => !featured || o.id !== featured.id), featured, now);
}

function renderFeatured(order, now) {
  const el = document.getElementById('featured');
  if (!order) { el.innerHTML = '<div class="no-fc">Nenhum pedido para hoje ainda 🎉</div>'; return; }
  const mins = Math.round((order.datetime - now) / 60000);
  const isLate = mins < 0;
  const isEntrega = order.tipo.toLowerCase().includes('entrega');
  const timerTxt = isLate ? `ATRASADO ${Math.abs(mins)}min`
    : mins === 0 ? 'AGORA!'
    : mins >= 60 ? `${Math.floor(mins/60)}h ${mins%60}min`
    : `${mins} min`;
  const timerCls = (isLate || mins <= 15) ? 'fc-timer-val urg' : 'fc-timer-val';
  const items = parseItems(order.pedido);
  el.innerHTML = `
    <div class="fc">
      <div class="fc-hdr">
        <span class="fc-badge">PRÓXIMO</span>
        <span class="fc-name">${esc(order.nome)}</span>
        <span class="fc-tipo">${isEntrega?'🛵 Entrega':'🛍️ Retirada'}</span>
      </div>
      ${isLate && !order.entregue ? `<div class="fc-late"><span style="font-size:1.2rem">⚠️</span><span class="fc-late-txt">Pedido atrasado! Marque como entregue.</span><span class="fc-late-min">${Math.abs(mins)}min</span></div>` : ''}
      <div class="fc-body">
        <div class="fc-box"><div class="fc-box-label">Horário</div><div class="fc-box-val hl">${fmtTime(order.datetime)}</div></div>
        <div class="fc-box"><div class="fc-box-label">Data</div><div class="fc-box-val">${fmtDate(order.datetime)}</div></div>
        <div class="fc-box"><div class="fc-box-label">Valor</div><div class="fc-box-val">${esc(String(order.valor||'—'))}</div></div>
        <div class="fc-timer">
          <div class="fc-timer-lbl">${isLate?'⚠️ Atrasado':'⏳ Tempo restante'}</div>
          <div class="${timerCls}" id="ftimer">${timerTxt}</div>
        </div>
      </div>
      <div class="items-toggle" onclick="this.classList.toggle('open');document.getElementById('fitems').classList.toggle('open')">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,5 7,10 12,5"/></svg>
        Ver itens do pedido
      </div>
      <div class="items-list" id="fitems">${items}</div>
      <div class="fc-foot">
        <div class="fc-phone">📞 ${esc(order.telefone||'—')}</div>
        <div class="fc-total">${esc(String(order.valor||''))}</div>
      </div>
      ${!order.entregue
        ? `<button class="btn-deliver${isLate?' late':''}" id="db-${order.id}" onclick="markDelivered('${order.id}')">✓ Marcar como ${isEntrega?'Entregue':'Retirado'}</button>`
        : `<div style="text-align:center;color:var(--green);font-size:.82rem;padding:10px 0">✅ Concluído</div>`}
    </div>`;
  startFeaturedTimer(order);
}

function startFeaturedTimer(order) {
  if (window._fti) clearInterval(window._fti);
  window._fti = setInterval(() => {
    const el = document.getElementById('ftimer');
    if (!el) { clearInterval(window._fti); return; }
    const now = new Date();
    const mins = Math.round((order.datetime - now) / 60000);
    const isLate = mins < 0;
    el.className = (isLate || mins <= 15) ? 'fc-timer-val urg' : 'fc-timer-val';
    el.textContent = isLate ? `ATRASADO ${Math.abs(mins)}min`
      : mins === 0 ? 'AGORA!'
      : mins >= 60 ? `${Math.floor(mins/60)}h ${mins%60}min`
      : `${mins} min`;
  }, 15000);
}

function renderQueue(list, featured, now) {
  const el = document.getElementById('queue');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Sem mais pedidos na fila.</div>';
    return;
  }
  el.innerHTML = list.map((o, i) => {
    const mins = Math.round((o.datetime - now) / 60000);
    const isLate = mins < 0;
    const isEntrega = o.tipo.toLowerCase().includes('entrega');
    const tc = isEntrega ? 'entrega' : 'retirada';
    const isUrg = mins >= 0 && mins <= 60;
    let cd = '', cdcls = '';
    if (o.entregue) { cd = '✅ Entregue'; }
    else if (isLate) { cd = `ATRASADO ${Math.abs(mins)}min`; cdcls = 'urg'; }
    else if (mins === 0) { cd = 'AGORA'; cdcls = 'urg'; }
    else if (mins >= 60) { cd = `${Math.floor(mins/60)}h${mins%60?` ${mins%60}min`:''}`; cdcls = ''; }
    else { cd = `${mins}min`; cdcls = isUrg ? 'urg' : 'soon'; }
    const items = parseItems(o.pedido);
    return `
      <div class="qcard ${tc}" style="${o.entregue?'opacity:.4;filter:saturate(0)':''}" onclick="this.querySelector('.qdetails').classList.toggle('open')">
        <div class="qcard-top">
          <span class="qpos">#${i+1}</span>
          <span class="qname">${esc(o.nome)}</span>
          <span class="qtime">${fmtTime(o.datetime)}</span>
        </div>
        <div class="qcard-bot">
          <span class="tag ${tc}">${isEntrega?'🛵 Entrega':'🛍️ Retirada'}</span>
          ${isLate&&!o.entregue?'<span class="tag urgente">⚠️ Atrasado</span>':isUrg&&!o.entregue?'<span class="tag urgente">🔥 Urgente</span>':''}
          <span class="qdate">${fmtDate(o.datetime)}</span>
          <span class="qcd ${cdcls}">${cd}</span>
        </div>
        <div class="qdetails">
          ${items}
          ${o.telefone?`<div style="margin-top:7px;font-size:.78rem;color:var(--text3)">📞 ${esc(o.telefone)}</div>`:''}
          ${o.valor?`<div style="font-size:.82rem;color:var(--green);font-weight:700;margin-top:3px">${esc(String(o.valor))}</div>`:''}
          ${!o.entregue?`<button class="btn-qdeliver${isLate?' late':''}" id="db-${o.id}" onclick="event.stopPropagation();markDelivered('${o.id}')">✓ Marcar como ${isEntrega?'Entregue':'Retirado'}</button>`
          :'<div style="color:var(--green);font-size:.75rem;padding:5px 0">✅ Concluído</div>'}
        </div>
      </div>`;
  }).join('');
}

// ── HELPERS ─────────────────────────────────────────────
function fmtTime(dt) { return dt ? new Date(dt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—'; }
function fmtDate(dt) { return dt ? new Date(dt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '—'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseItems(txt) {
  if (!txt) return '<div style="color:var(--text3);font-size:.78rem">Sem detalhes</div>';
  return String(txt).split('\n').map(l => {
    l = l.trim(); if (!l) return '';
    if (/^[^0-9].+:$/.test(l)) return `<div class="icat">${esc(l.replace(':',''))}</div>`;
    const m = l.match(/^(\d+)\s+(.+)/);
    if (m) return `<div class="irow"><span class="iqty">${m[1]}</span><span class="iname">${esc(m[2])}</span></div>`;
    return `<div class="irow"><span class="iname" style="font-size:.75rem;font-style:italic;color:var(--text3)">${esc(l)}</span></div>`;
  }).join('');
}

// ── BOOT ────────────────────────────────────────────────
fetchOrders();
setInterval(fetchOrders, 2 * 60 * 1000);
setInterval(renderAll, 30000);

// Unlock audio on first interaction
['click','keydown','touchstart'].forEach(ev =>
  document.addEventListener(ev, function h() {
    if (!audioUnlocked) unlockAudio();
    document.removeEventListener(ev, h);
  }, { once: true })
);

// PWA Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
